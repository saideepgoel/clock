<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClockTab - IST</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="favicon.svg?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101012;
    --ink:#f2f2f2;
    --ink-dim:#8a8a8e;
    --ink-faint:#4c4c50;
    --accent:#d8d8da;
    --accent-dim:#5a5a5e;
    --sage:#7ba98a;
    --rust:#b97a7a;
    --panel-bg: rgba(20,20,22,0.94);
    --hairline: rgba(242,242,242,0.08);
    --sans: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    user-select:none;
  }
  body{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh; position:relative;
  }

  #clockWrap{
    display:flex; align-items:baseline; justify-content:center; gap:0.35em;
    position:relative; z-index:2;
  }
  #time{
    font-family:var(--sans);
    font-size:min(21vw, 240px);
    font-weight:500;
    line-height:1;
    letter-spacing:-0.01em;
    color:var(--ink);
    font-variant-numeric: tabular-nums;
    white-space:nowrap;
    display:flex;
    align-items:baseline;
  }
  .colon{
    display:inline-block;
    animation: breathe 2s ease-in-out infinite;
    color:var(--ink-dim);
    padding:0 0.03em;
    font-weight:400;
  }
  @keyframes breathe{
    0%, 40%{ opacity:1; }
    50%{ opacity:0.25; }
    100%{ opacity:1; }
  }
  #ampm{
    font-family:var(--sans);
    font-size:min(2vw, 22px);
    font-weight:500;
    color:var(--ink-faint);
    letter-spacing:0.04em;
    margin-left:0.3em;
  }
  #seconds{
    font-family:var(--sans);
    font-size:min(6vw, 68px);
    font-weight:300;
    color:var(--ink-faint);
    font-variant-numeric: tabular-nums;
    margin-left:0.1em;
  }
  #date{
    margin-top:32px;
    font-size:min(1.5vw, 15px);
    letter-spacing:0.04em;
    color:var(--ink-dim);
    font-weight:400;
    position:relative; z-index:2;
  }

  #gearBtn{
    position:fixed; bottom:26px; right:28px;
    width:32px; height:32px;
    border-radius:50%;
    color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:15px;
    opacity:0.6;
    transition:opacity .25s ease, color .25s ease, transform .25s ease;
    z-index:20;
  }
  #gearBtn:hover{ opacity:1; color:var(--ink); transform:rotate(20deg); }

  #countdowns{
    position:fixed; bottom:28px; left:30px;
    display:flex; flex-direction:column; gap:14px;
    max-width:46vw;
    z-index:15;
  }
  .cd-pill{
    display:flex; align-items:baseline; justify-content:space-between; gap:20px;
    padding-bottom:9px;
    border-bottom:1px solid var(--hairline);
  }
  .cd-pill .cd-name{ color:var(--ink-dim); font-size:12px; font-weight:500; }
  .cd-pill .cd-value{ font-family:var(--serif); font-variant-numeric: tabular-nums; font-size:17px; color:var(--ink); font-weight:400; }
  .cd-x{ cursor:pointer; color:var(--ink-faint); font-size:13px; padding:0 2px; transition:color .2s; }
  .cd-x:hover{ color:var(--rust); }

  #panel{
    position:fixed; bottom:0; right:0;
    width:300px; max-width:92vw;
    background:var(--panel-bg);
    border-left:1px solid var(--hairline);
    border-top:1px solid var(--hairline);
    border-radius:18px 0 0 0;
    padding:24px;
    transform:translateY(110%);
    transition:transform .35s cubic-bezier(.22,.9,.3,1);
    z-index:30;
    backdrop-filter: blur(16px);
    max-height:80vh;
    overflow-y:auto;
  }
  #panel.open{ transform:translateY(0); }
  #panel h3{
    margin:0 0 15px 0; font-size:12px; color:var(--ink-faint); font-weight:500; letter-spacing:0.02em;
  }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0; border-bottom:1px solid var(--hairline);
    font-size:13px; color:var(--ink);
  }
  .row:last-of-type{ border-bottom:none; }
  .status-dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--ink-faint); margin-right:8px; transition:background .4s ease;
  }
  .status-dot.ok{ background:var(--sage); }
  .status-dot.bad{ background:var(--rust); }
  .btn{
    background:rgba(239,228,211,0.05);
    border:1px solid var(--hairline);
    color:var(--ink);
    padding:6px 13px;
    border-radius:8px;
    font-size:12px;
    cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .btn:hover{ background:rgba(242,242,242,0.1); border-color:var(--accent-dim); }
  .btn.small{ padding:5px 11px; font-size:11px; }
  .toggle-group{ display:flex; gap:6px; }
  .toggle-group .btn.active{ background:var(--accent); color:#101012; border-color:var(--accent); }

  #cdForm{ margin-top:14px; display:flex; flex-direction:column; gap:9px; }
  #cdForm input{
    background:rgba(242,242,242,0.05);
    border:1px solid var(--hairline);
    color:var(--ink);
    padding:8px 11px;
    border-radius:8px;
    font-size:13px;
    outline:none;
    font-family:var(--sans);
  }
  #cdForm input::placeholder{ color:var(--ink-faint); }
  #cdForm input:focus{ border-color:var(--accent-dim); }

  #closePanel{
    position:absolute; top:16px; right:18px; cursor:pointer; color:var(--ink-faint); font-size:15px;
    transition:color .2s;
  }
  #closePanel:hover{ color:var(--ink); }

  @media (max-width:600px){
    #countdowns{ max-width:70vw; }
    #panel{ width:100%; border-radius:18px 18px 0 0; }
  }
</style>
</head>
<body>

  <div id="clockWrap">
    <div id="time">--<span class="colon">:</span>--</div>
    <div id="seconds">--</div>
    <div id="ampm"></div>
  </div>
  <div id="date">Loading</div>

  <div id="countdowns"></div>

  <div id="gearBtn" title="Settings">⚙</div>

  <div id="panel">
    <span id="closePanel">✕</span>
    <h3>Display</h3>
    <div class="row">
      <span>Time format</span>
      <div class="toggle-group">
        <div class="btn small" id="fmt12">12h</div>
        <div class="btn small" id="fmt24">24h</div>
      </div>
    </div>
    <div class="row">
      <span>Fullscreen</span>
      <div class="btn small" id="fsBtn">Toggle</div>
    </div>
    <div class="row">
      <span>Time source</span>
      <div class="btn small" id="resyncBtn">Resync IST</div>
    </div>
    <div class="row" style="border-bottom:none; font-size:11px; color:var(--ink-faint);">
      <span><span class="status-dot" id="statusDot"></span><span id="syncInfo">Not synced yet</span></span>
    </div>

    <h3 style="margin-top:22px;">Countdown</h3>
    <div id="cdForm">
      <input type="text" id="cdName" placeholder="Label (e.g. Exam, Launch)" maxlength="30">
      <input type="datetime-local" id="cdDate">
      <div class="btn" id="addCdBtn">Add countdown</div>
    </div>
  </div>

<script>
(function(){
  // ---------- Time sync ----------
  let offsetMs = 0;
  let lastSyncAt = null;
  let synced = false;
  const IST_TZ = 'Asia/Kolkata';

  async function fetchServerTime(){
    const attempts = [
      async () => {
        const t0 = Date.now();
        const res = await fetch('https://timeapi.io/api/time/current/zone?timeZone=' + IST_TZ, {cache:'no-store'});
        const t1 = Date.now();
        const data = await res.json();
        // data.year/month/day/hour/minute/seconds are IST wall-clock values.
        // Date.UTC treats them as UTC numbers regardless of the device's own timezone,
        // so subtracting the fixed +05:30 offset gives the correct UTC instant no matter
        // where the browser thinks it lives.
        const wallAsUTC = Date.UTC(data.year, data.month-1, data.day, data.hour, data.minute, data.seconds, (data.milliSeconds||0));
        const trueUtc = wallAsUTC - (5*60+30)*60000;
        return trueUtc + (t1 - t0) / 2;
      },
      async () => {
        const t0 = Date.now();
        const res = await fetch('https://worldtimeapi.org/api/timezone/' + IST_TZ, {cache:'no-store'});
        const t1 = Date.now();
        const data = await res.json();
        return (data.unixtime * 1000) + (t1 - t0) / 2;
      },
      async () => {
        const t0 = Date.now();
        const res = await fetch('https://worldclockapi.com/api/json/utc/now', {cache:'no-store'});
        const t1 = Date.now();
        const data = await res.json();
        const utcMs = Date.parse(data.currentDateTime);
        return utcMs + (t1 - t0) / 2;
      }
    ];
    for (const attempt of attempts){
      try{ return await attempt(); }catch(e){ /* try next */ }
    }
    return null;
  }

  async function resync(){
    setStatus('syncing');
    const trueUtcMs = await fetchServerTime();
    if (trueUtcMs !== null){
      offsetMs = trueUtcMs - Date.now();
      synced = true;
      lastSyncAt = Date.now();
      setStatus('ok');
    } else {
      synced = false;
      setStatus('bad');
    }
    updateSyncInfo();
  }

  let statusKind = 'syncing';
  function setStatus(kind){
    statusKind = kind;
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot' + (kind==='ok' ? ' ok' : kind==='bad' ? ' bad' : '');
  }

  function updateSyncInfo(){
    const el = document.getElementById('syncInfo');
    if (statusKind === 'syncing' && !lastSyncAt){ el.textContent = 'Syncing…'; return; }
    if (!lastSyncAt){ el.textContent = 'Not synced yet'; return; }
    const mins = Math.floor((Date.now() - lastSyncAt)/60000);
    el.textContent = synced
      ? ('Synced with IST server • ' + (mins < 1 ? 'just now' : mins + ' min ago'))
      : 'Offline — using device clock';
  }

  function nowIST(){ return new Date(Date.now() + offsetMs); }

  function istParts(){
    const d = nowIST();
    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: IST_TZ, hour12:false,
      hour:'2-digit', minute:'2-digit', second:'2-digit',
      year:'numeric', month:'long', day:'2-digit', weekday:'long'
    });
    const parts = fmt.formatToParts(d);
    const map = {};
    parts.forEach(p => map[p.type] = p.value);
    return map;
  }

  // ---------- Rendering (targeted text updates only — no DOM rebuilds) ----------
  let use24 = JSON.parse(localStorage.getItem('clocktab_use24') || 'false');

  const timeEl = document.getElementById('time');
  const secEl = document.getElementById('seconds');
  const ampmEl = document.getElementById('ampm');
  const dateEl = document.getElementById('date');

  function render(){
    const p = istParts();
    let h = parseInt(p.hour, 10);
    let ampm = '';
    if (!use24){
      ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12; if (h === 0) h = 12;
    }
    const hh = String(h).padStart(2,'0');
    timeEl.innerHTML = `${hh}<span class="colon">:</span>${p.minute}`;
    if (secEl.textContent !== ':' + p.second) secEl.textContent = ':' + p.second;
    if (ampmEl.textContent !== ampm) ampmEl.textContent = ampm;
    const newDate = `${p.weekday}, ${p.day} ${p.month}`;
    if (dateEl.textContent !== newDate) dateEl.textContent = newDate;
    updateSyncInfo();
    tickCountdowns();
  }

  setInterval(render, 1000);

  // ---------- Format toggle ----------
  function paintFmtButtons(){
    document.getElementById('fmt12').classList.toggle('active', !use24);
    document.getElementById('fmt24').classList.toggle('active', use24);
  }
  document.getElementById('fmt12').onclick = () => { use24=false; localStorage.setItem('clocktab_use24','false'); paintFmtButtons(); render(); };
  document.getElementById('fmt24').onclick = () => { use24=true; localStorage.setItem('clocktab_use24','true'); paintFmtButtons(); render(); };
  paintFmtButtons();

  // ---------- Fullscreen ----------
  function toggleFullscreen(){
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  }
  document.getElementById('fsBtn').onclick = toggleFullscreen;
  document.getElementById('resyncBtn').onclick = resync;

  const panel = document.getElementById('panel');
  document.getElementById('gearBtn').onclick = () => panel.classList.toggle('open');
  document.getElementById('closePanel').onclick = () => panel.classList.remove('open');

  window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase()==='f') toggleFullscreen();
    if (e.key.toLowerCase()==='t'){ use24=!use24; localStorage.setItem('clocktab_use24', JSON.stringify(use24)); paintFmtButtons(); render(); }
    if (e.key.toLowerCase()==='r') resync();
    if (e.key==='Escape') panel.classList.remove('open');
  });

  // ---------- Countdowns (DOM nodes created once, values patched in place) ----------
  function loadCountdowns(){
    try{ return JSON.parse(localStorage.getItem('clocktab_countdowns') || '[]'); }
    catch(e){ return []; }
  }
  function saveCountdowns(list){ localStorage.setItem('clocktab_countdowns', JSON.stringify(list)); }

  let countdowns = loadCountdowns();
  const cdWrap = document.getElementById('countdowns');
  const cdNodes = new Map();

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function formatRemaining(ms){
    if (ms <= 0) return 'Arrived';
    const s = Math.floor(ms/1000);
    const days = Math.floor(s/86400);
    const hrs = Math.floor((s%86400)/3600);
    const mins = Math.floor((s%3600)/60);
    const secs = s%60;
    if (days > 0) return `${days}d ${String(hrs).padStart(2,'0')}h ${String(mins).padStart(2,'0')}m`;
    return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }

  function buildPill(c){
    const root = document.createElement('div');
    root.className = 'cd-pill';
    root.innerHTML = `
      <span class="cd-name">${escapeHtml(c.name)}</span>
      <span class="cd-value"></span>
      <span class="cd-x">✕</span>
    `;
    root.querySelector('.cd-x').onclick = () => removeCountdown(c.id);
    return root;
  }

  function syncCountdownDom(){
    for (const [id, nodes] of cdNodes){
      if (!countdowns.find(c => c.id === id)){
        nodes.root.remove();
        cdNodes.delete(id);
      }
    }
    countdowns.forEach(c => {
      if (!cdNodes.has(c.id)){
        const root = buildPill(c);
        cdWrap.appendChild(root);
        cdNodes.set(c.id, { root, valueEl: root.querySelector('.cd-value') });
      }
    });
  }

  function tickCountdowns(){
    const nowMs = Date.now() + offsetMs;
    countdowns.forEach(c => {
      const nodes = cdNodes.get(c.id);
      if (!nodes) return;
      const text = formatRemaining(c.targetMs - nowMs);
      if (nodes.valueEl.textContent !== text) nodes.valueEl.textContent = text;
    });
  }

  function removeCountdown(id){
    countdowns = countdowns.filter(c => c.id !== id);
    saveCountdowns(countdowns);
    syncCountdownDom();
  }

  document.getElementById('addCdBtn').onclick = () => {
    const nameEl = document.getElementById('cdName');
    const dateInput = document.getElementById('cdDate');
    const name = nameEl.value.trim();
    const val = dateInput.value;
    if (!name || !val) return;
    const targetMs = new Date(val).getTime();
    if (isNaN(targetMs)) return;
    countdowns.push({ id: Date.now().toString(36), name, targetMs });
    saveCountdowns(countdowns);
    nameEl.value = ''; dateInput.value = '';
    syncCountdownDom();
    tickCountdowns();
  };

  syncCountdownDom();

  // ---------- Init ----------
  render();
  resync();
  setInterval(resync, 15 * 60 * 1000);
})();
</script>
</body>
</html>
