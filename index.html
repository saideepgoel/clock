<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IST Precision Clock</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="apple-touch-icon" href="favicon.svg?v=2">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;700&display=swap" rel="stylesheet">

    <style>
        /* 2. BASIC SETUP */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            cursor: none;

            /* Very subtle gradient */
            background: radial-gradient(circle at center, #111111 0%, #000000 70%);
        }

        /* 3. CLOCK STYLING */
        .clock-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            line-height: 1;
        }

        #main-time {
            font-size: 28vw;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
            /* Glow */
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.2), 0 0 80px rgba(255, 255, 255, 0.1);
        }

        #seconds {
            font-size: 6vw;
            font-weight: 200;
            color: #ffffff;
            opacity: 0.4;
            margin-left: 1.5vw;
            font-variant-numeric: tabular-nums;
            width: 8vw;
            transform: translateY(-2vw);
        }

        #date {
            font-size: 1.2vw;
            font-weight: 200;
            margin-top: 2vh;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.8em;
        }

        /* Status indicator (Syncing vs Synced) */
        #sync-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 10px;
            color: #333;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 4. GLASS BUTTONS */
        .controls {
            position: absolute;
            bottom: 40px;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            gap: 15px;
        }

        body:hover .controls {
            opacity: 1;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .spotify-dock {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            z-index: 3;
        }

        .spotify-handle {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            background: rgba(15, 15, 15, 0.9);
            color: rgba(160, 255, 180, 0.92);
            border: 1px solid rgba(88, 255, 118, 0.35);
            border-right: none;
            border-radius: 12px 0 0 12px;
            padding: 12px 8px;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .spotify-panel {
            width: min(540px, 96vw);
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(160deg, rgba(26, 26, 26, 0.82), rgba(9, 9, 9, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
            transform: translateX(calc(100% - 30px));
            opacity: 0.25;
            transition: transform 0.3s ease, opacity 0.3s ease;
            max-height: 88vh;
            overflow: auto;
        }

        .spotify-dock:hover .spotify-panel,
        .spotify-dock:focus-within .spotify-panel,
        .spotify-dock.open .spotify-panel {
            transform: translateX(0);
            opacity: 1;
        }

        .spotify-title {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
        }

        .spotify-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .spotify-row:last-child {
            margin-bottom: 0;
        }

        .spotify-panel input,
        .spotify-panel select {
            flex: 1;
            min-width: 0;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            padding: 8px 10px;
            font-size: 12px;
        }

        .spotify-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.75);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spotify-now {
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-bottom: 8px;
            min-height: 56px;
        }

        .spotify-now-track {
            font-size: 13px;
            color: #fff;
            margin-bottom: 3px;
        }

        .spotify-now-meta {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.65);
        }

        .spotify-section-label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.56);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 4px 0;
        }

        .spotify-mini-btn {
            width: 100%;
            padding: 8px 10px;
            font-size: 11px;
            border-radius: 8px;
        }

        .spotify-mini-btn.primary {
            color: #d3ffd9;
            border-color: rgba(88, 255, 118, 0.35);
            background: rgba(36, 180, 69, 0.25);
        }
    </style>
</head>

<body>

    <div id="sync-status">Wait...</div>

    <div class="clock-wrapper">
        <div id="main-time">00:00</div>
        <div id="seconds">00</div>
    </div>

    <div id="date">Loading...</div>

    <div class="controls">
        <button onclick="toggleFormat()">12h / 24h</button>
        <button onclick="toggleFullscreen()">Fullscreen</button>
        <button id="resync-btn" onclick="forceSync()">Resync Time</button>
    </div>

    <div id="spotify-dock" class="spotify-dock">
        <button id="spotify-toggle" class="spotify-handle" onclick="toggleSpotifyPanel()">Spotify</button>
        <div class="spotify-panel" aria-label="Spotify connect controls">
            <div class="spotify-title">Spotify Connect Studio (hover/focus to open)</div>
            <div class="spotify-now">
                <div id="spotify-now-track" class="spotify-now-track">No active track</div>
                <div id="spotify-now-meta" class="spotify-now-meta">Log in and refresh player state.</div>
            </div>
            <div class="spotify-row">
                <input id="spotify-client-id" placeholder="Spotify Client ID" />
                <button class="spotify-mini-btn" onclick="saveClientId()">Save ID</button>
            </div>
            <div class="spotify-row">
                <button class="spotify-mini-btn" onclick="spotifyLogin()">Login</button>
                <button class="spotify-mini-btn" onclick="spotifyLogout()">Logout</button>
                <button class="spotify-mini-btn" onclick="refreshPlayerState()">Refresh State</button>
            </div>
            <div class="spotify-section-label">Device & playback</div>
            <div class="spotify-row">
                <select id="spotify-device-select">
                    <option value="">Select device</option>
                </select>
                <button class="spotify-mini-btn" onclick="loadDevices()">Devices</button>
            </div>
            <div class="spotify-row">
                <button class="spotify-mini-btn" onclick="spotifyPrevious()">Prev</button>
                <button class="spotify-mini-btn primary" onclick="spotifyTogglePlayPause()">Play/Pause</button>
                <button class="spotify-mini-btn" onclick="spotifyNext()">Next</button>
            </div>
            <div class="spotify-section-label">Play a playlist</div>
            <div class="spotify-row">
                <select id="spotify-playlist-select">
                    <option value="">Select playlist</option>
                </select>
                <button class="spotify-mini-btn" onclick="loadPlaylists()">Load</button>
                <button class="spotify-mini-btn primary" onclick="playSelectedPlaylist()">Play Playlist</button>
            </div>
            <div class="spotify-section-label">Search and play song</div>
            <div class="spotify-row">
                <input id="spotify-search-input" placeholder="Search song or artist" />
                <button class="spotify-mini-btn" onclick="searchTracks()">Search</button>
            </div>
            <div class="spotify-row">
                <select id="spotify-track-select">
                    <option value="">Select song</option>
                </select>
                <button class="spotify-mini-btn primary" onclick="playSelectedTrack()">Play Song</button>
            </div>
            <div id="spotify-status" class="spotify-status">Not logged in</div>
        </div>
    </div>

    <script>
        let is24Hour = false;
        let timeOffset = 0; // The difference between local time and IST server time
        let syncInProgress = false;

        const timeEl = document.getElementById('main-time');
        const secEl = document.getElementById('seconds');
        const dateEl = document.getElementById('date');
        const statusEl = document.getElementById('sync-status');
        const bodyEl = document.body;
        const syncButton = document.getElementById('resync-btn');
        const spotifyClientIdEl = document.getElementById('spotify-client-id');
        const spotifyDockEl = document.getElementById('spotify-dock');
        const spotifyDeviceSelectEl = document.getElementById('spotify-device-select');
        const spotifyPlaylistSelectEl = document.getElementById('spotify-playlist-select');
        const spotifyTrackSelectEl = document.getElementById('spotify-track-select');
        const spotifySearchInputEl = document.getElementById('spotify-search-input');
        const spotifyStatusEl = document.getElementById('spotify-status');
        const spotifyNowTrackEl = document.getElementById('spotify-now-track');
        const spotifyNowMetaEl = document.getElementById('spotify-now-meta');

        const SPOTIFY_CLIENT_ID_KEY = 'spotify_client_id';
        const SPOTIFY_ACCESS_TOKEN_KEY = 'spotify_access_token';
        const SPOTIFY_REFRESH_TOKEN_KEY = 'spotify_refresh_token';
        const SPOTIFY_TOKEN_EXP_KEY = 'spotify_token_exp';
        const SPOTIFY_PKCE_VERIFIER_KEY = 'spotify_pkce_verifier';
        const SPOTIFY_SCOPES = [
            'user-read-playback-state',
            'user-modify-playback-state',
            'user-read-currently-playing',
            'playlist-read-private',
            'playlist-read-collaborative',
            'user-read-private'
        ].join(' ');

        const timeFormatter24 = new Intl.DateTimeFormat('en-IN', {
            timeZone: 'Asia/Kolkata',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
        const dateFormatter = new Intl.DateTimeFormat('en-IN', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            timeZone: 'Asia/Kolkata'
        });

        spotifyClientIdEl.value = localStorage.getItem(SPOTIFY_CLIENT_ID_KEY) || '';
        spotifySearchInputEl.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                searchTracks();
            }
        });

        // 1. FETCH EXACT IST TIME
        async function syncTime() {
            if (syncInProgress) return;
            syncInProgress = true;
            syncButton.disabled = true;
            statusEl.innerText = "Syncing...";
            statusEl.style.color = "#888";

            try {
                const requestStartedAt = Date.now();
                const response = await fetch('https://worldtimeapi.org/api/timezone/Asia/Kolkata', {
                    cache: 'no-store'
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const requestEndedAt = Date.now();

                const serverUnix = Number(data.unixtime);
                if (!Number.isFinite(serverUnix)) throw new Error("Invalid unixtime payload");
                const serverTime = (serverUnix * 1000) + Math.round((requestEndedAt - requestStartedAt) / 2);

                // Calculate offset: Server - Local
                timeOffset = serverTime - requestEndedAt;

                statusEl.innerText = "IST LIVE";
                statusEl.style.color = "#004400"; // Dark green invisible mostly
                updateClock();
            } catch (error) {
                console.error("Sync failed, using system time", error);
                statusEl.innerText = "OFFLINE MODE";
                statusEl.style.color = "#550000";
                // If fetch fails, offset remains what it was (or 0)
            } finally {
                syncInProgress = false;
                syncButton.disabled = false;
            }
        }

        async function forceSync() {
            await syncTime();
        }

        // 2. CLOCK TICK (Runs every second)
        function updateClock() {
            // Get current local time + the offset we calculated from internet
            const adjustedNow = new Date(Date.now() + timeOffset);
            const parts = timeFormatter24.formatToParts(adjustedNow);
            const getPart = (type) => parts.find((part) => part.type === type)?.value || "00";

            let hours = Number(getPart('hour'));
            const minutes = getPart('minute');
            const seconds = getPart('second');

            if (!is24Hour) {
                hours = hours % 12;
                hours = hours ? hours : 12;
            } else {
                hours = String(hours).padStart(2, '0');
            }

            timeEl.innerText = `${hours}:${minutes}`;
            secEl.innerText = seconds;

            dateEl.innerText = dateFormatter.format(adjustedNow);
        }

        function toggleFormat() {
            is24Hour = !is24Hour;
            updateClock();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function saveClientId() {
            const clientId = spotifyClientIdEl.value.trim();
            if (!clientId) {
                spotifyStatusEl.innerText = "Enter your Spotify Client ID first.";
                return;
            }
            localStorage.setItem(SPOTIFY_CLIENT_ID_KEY, clientId);
            spotifyStatusEl.innerText = "Client ID saved.";
        }

        function toggleSpotifyPanel() {
            spotifyDockEl.classList.toggle('open');
        }

        function spotifyLogout() {
            localStorage.removeItem(SPOTIFY_ACCESS_TOKEN_KEY);
            localStorage.removeItem(SPOTIFY_REFRESH_TOKEN_KEY);
            localStorage.removeItem(SPOTIFY_TOKEN_EXP_KEY);
            spotifyStatusEl.innerText = "Logged out from Spotify.";
            spotifyNowTrackEl.innerText = "No active track";
            spotifyNowMetaEl.innerText = "Log in and refresh player state.";
        }

        function getSpotifyToken() {
            return localStorage.getItem(SPOTIFY_ACCESS_TOKEN_KEY);
        }

        function isTokenValid() {
            const exp = Number(localStorage.getItem(SPOTIFY_TOKEN_EXP_KEY) || 0);
            return !!getSpotifyToken() && Date.now() < exp;
        }

        function createVerifier() {
            const array = new Uint8Array(32);
            crypto.getRandomValues(array);
            return btoa(String.fromCharCode(...array)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function createChallenge(verifier) {
            const data = new TextEncoder().encode(verifier);
            const digest = await crypto.subtle.digest('SHA-256', data);
            const bytes = new Uint8Array(digest);
            return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function spotifyLogin() {
            const clientId = (localStorage.getItem(SPOTIFY_CLIENT_ID_KEY) || spotifyClientIdEl.value).trim();
            if (!clientId) {
                spotifyStatusEl.innerText = "Set your Spotify Client ID, then login.";
                return;
            }
            const verifier = createVerifier();
            const challenge = await createChallenge(verifier);
            localStorage.setItem(SPOTIFY_PKCE_VERIFIER_KEY, verifier);
            const params = new URLSearchParams({
                client_id: clientId,
                response_type: 'code',
                redirect_uri: window.location.origin + window.location.pathname,
                code_challenge_method: 'S256',
                code_challenge: challenge,
                scope: SPOTIFY_SCOPES
            });
            window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
        }

        async function exchangeCodeForToken(code) {
            const clientId = localStorage.getItem(SPOTIFY_CLIENT_ID_KEY);
            const verifier = localStorage.getItem(SPOTIFY_PKCE_VERIFIER_KEY);
            if (!clientId || !verifier) return false;
            const body = new URLSearchParams({
                grant_type: 'authorization_code',
                code,
                redirect_uri: window.location.origin + window.location.pathname,
                client_id: clientId,
                code_verifier: verifier
            });
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body
            });
            if (!response.ok) return false;
            const token = await response.json();
            localStorage.setItem(SPOTIFY_ACCESS_TOKEN_KEY, token.access_token);
            localStorage.setItem(SPOTIFY_REFRESH_TOKEN_KEY, token.refresh_token || '');
            localStorage.setItem(SPOTIFY_TOKEN_EXP_KEY, String(Date.now() + ((token.expires_in || 3600) - 30) * 1000));
            localStorage.removeItem(SPOTIFY_PKCE_VERIFIER_KEY);
            return true;
        }

        async function refreshSpotifyTokenIfNeeded() {
            if (isTokenValid()) return true;
            const refreshToken = localStorage.getItem(SPOTIFY_REFRESH_TOKEN_KEY);
            const clientId = localStorage.getItem(SPOTIFY_CLIENT_ID_KEY);
            if (!refreshToken || !clientId) return false;
            const body = new URLSearchParams({
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
                client_id: clientId
            });
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body
            });
            if (!response.ok) return false;
            const token = await response.json();
            localStorage.setItem(SPOTIFY_ACCESS_TOKEN_KEY, token.access_token);
            localStorage.setItem(SPOTIFY_TOKEN_EXP_KEY, String(Date.now() + ((token.expires_in || 3600) - 30) * 1000));
            return true;
        }

        async function spotifyApi(path, method = 'GET', body = null) {
            const tokenReady = await refreshSpotifyTokenIfNeeded();
            if (!tokenReady) throw new Error('Login required');
            const token = getSpotifyToken();
            const response = await fetch(`https://api.spotify.com/v1${path}`, {
                method,
                headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: body ? JSON.stringify(body) : undefined
            });
            if (!response.ok && response.status !== 204) {
                const text = await response.text();
                throw new Error(`Spotify API ${response.status}: ${text}`);
            }
            if (response.status === 204) return null;
            return await response.json();
        }

        async function loadDevices() {
            try {
                const data = await spotifyApi('/me/player/devices');
                const devices = data?.devices || [];
                spotifyDeviceSelectEl.innerHTML = '<option value="">Select device</option>';
                devices.forEach((device) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.innerText = `${device.name}${device.is_active ? ' (Active)' : ''}`;
                    spotifyDeviceSelectEl.appendChild(option);
                    if (device.is_active) spotifyDeviceSelectEl.value = device.id;
                });
                spotifyStatusEl.innerText = devices.length
                    ? "Devices loaded. Pick your desktop Spotify device."
                    : "No active devices. Open Spotify app on your PC first.";
            } catch (error) {
                spotifyStatusEl.innerText = `Device load failed: ${error.message}`;
            }
        }

        async function loadPlaylists() {
            try {
                let nextPath = '/me/playlists?limit=50';
                const playlists = [];
                while (nextPath && playlists.length < 200) {
                    const data = await spotifyApi(nextPath);
                    playlists.push(...(data?.items || []));
                    nextPath = data?.next ? data.next.replace('https://api.spotify.com/v1', '') : null;
                }
                spotifyPlaylistSelectEl.innerHTML = '<option value="">Select playlist</option>';
                playlists.forEach((playlist) => {
                    const option = document.createElement('option');
                    option.value = playlist.uri;
                    option.innerText = `${playlist.name} (${playlist.tracks.total})`;
                    spotifyPlaylistSelectEl.appendChild(option);
                });
                spotifyStatusEl.innerText = playlists.length
                    ? "Playlists loaded."
                    : "No playlists available on this account.";
            } catch (error) {
                spotifyStatusEl.innerText = `Playlist load failed: ${error.message}`;
            }
        }

        async function searchTracks() {
            const query = spotifySearchInputEl.value.trim();
            if (!query) {
                spotifyStatusEl.innerText = "Enter a song or artist to search.";
                return;
            }
            try {
                const data = await spotifyApi(`/search?type=track&limit=25&market=from_token&q=${encodeURIComponent(query)}`);
                const tracks = data?.tracks?.items || [];
                spotifyTrackSelectEl.innerHTML = '<option value="">Select song</option>';
                tracks.forEach((track) => {
                    const option = document.createElement('option');
                    option.value = track.uri;
                    const artistNames = (track.artists || []).map((artist) => artist.name).join(', ');
                    option.innerText = `${track.name} — ${artistNames}`;
                    spotifyTrackSelectEl.appendChild(option);
                });
                spotifyStatusEl.innerText = tracks.length
                    ? `Found ${tracks.length} songs.`
                    : "No songs found for that search.";
            } catch (error) {
                spotifyStatusEl.innerText = `Search failed: ${error.message}`;
            }
        }

        function selectedDeviceId() {
            if (spotifyDeviceSelectEl.value) return spotifyDeviceSelectEl.value;
            const activeDeviceOption = Array.from(spotifyDeviceSelectEl.options).find((option) => option.text.includes('(Active)'));
            return activeDeviceOption?.value || undefined;
        }

        async function spotifyTransferIfNeeded() {
            const deviceId = selectedDeviceId();
            if (!deviceId) return;
            await spotifyApi('/me/player', 'PUT', { device_ids: [deviceId], play: false });
        }

        function withDeviceQuery() {
            const deviceId = selectedDeviceId();
            return deviceId ? `?device_id=${encodeURIComponent(deviceId)}` : '';
        }

        async function playSelectedPlaylist() {
            const playlistUri = spotifyPlaylistSelectEl.value;
            if (!playlistUri) {
                spotifyStatusEl.innerText = "Select a playlist first.";
                return;
            }
            try {
                await spotifyTransferIfNeeded();
                await spotifyApi(`/me/player/play${withDeviceQuery()}`, 'PUT', { context_uri: playlistUri });
                spotifyStatusEl.innerText = "Playlist play command sent.";
                await refreshPlayerState();
            } catch (error) {
                spotifyStatusEl.innerText = `Play playlist failed: ${error.message}`;
            }
        }

        async function playSelectedTrack() {
            const trackUri = spotifyTrackSelectEl.value;
            if (!trackUri) {
                spotifyStatusEl.innerText = "Select a song first.";
                return;
            }
            try {
                await spotifyTransferIfNeeded();
                await spotifyApi(`/me/player/play${withDeviceQuery()}`, 'PUT', { uris: [trackUri] });
                spotifyStatusEl.innerText = "Song play command sent.";
                await refreshPlayerState();
            } catch (error) {
                spotifyStatusEl.innerText = `Play song failed: ${error.message}`;
            }
        }

        async function refreshPlayerState() {
            try {
                const state = await spotifyApi('/me/player');
                const item = state?.item;
                if (!item) {
                    spotifyNowTrackEl.innerText = "No active track";
                    spotifyNowMetaEl.innerText = "Start music in Spotify app, then refresh.";
                    spotifyStatusEl.innerText = "Player state fetched.";
                    return;
                }
                const artists = (item.artists || []).map((artist) => artist.name).join(', ');
                spotifyNowTrackEl.innerText = `${item.name}`;
                spotifyNowMetaEl.innerText = `${artists} • ${state?.device?.name || 'Unknown device'} • ${state?.is_playing ? 'Playing' : 'Paused'}`;
                spotifyStatusEl.innerText = "Player state fetched.";
            } catch (error) {
                spotifyStatusEl.innerText = `State fetch failed: ${error.message}`;
            }
        }

        async function spotifyPrevious() {
            try {
                await spotifyTransferIfNeeded();
                await spotifyApi(`/me/player/previous${withDeviceQuery()}`, 'POST');
                spotifyStatusEl.innerText = "Previous track command sent.";
                await refreshPlayerState();
            } catch (error) {
                spotifyStatusEl.innerText = `Prev failed: ${error.message}`;
            }
        }

        async function spotifyNext() {
            try {
                await spotifyTransferIfNeeded();
                await spotifyApi(`/me/player/next${withDeviceQuery()}`, 'POST');
                spotifyStatusEl.innerText = "Next track command sent.";
                await refreshPlayerState();
            } catch (error) {
                spotifyStatusEl.innerText = `Next failed: ${error.message}`;
            }
        }

        async function spotifyTogglePlayPause() {
            try {
                await spotifyTransferIfNeeded();
                const state = await spotifyApi('/me/player');
                const currentlyPlaying = !!state?.is_playing;
                const action = currentlyPlaying ? 'pause' : 'play';
                await spotifyApi(`/me/player/${action}${withDeviceQuery()}`, 'PUT');
                spotifyStatusEl.innerText = currentlyPlaying ? "Pause command sent." : "Play command sent.";
                await refreshPlayerState();
            } catch (error) {
                spotifyStatusEl.innerText = `Play/Pause failed: ${error.message}`;
            }
        }

        // Mouse hider logic
        let timeout;
        document.onmousemove = function () {
            bodyEl.style.cursor = "auto";
            document.querySelector('.controls').style.opacity = "1";
            clearTimeout(timeout);
            timeout = setTimeout(function () {
                bodyEl.style.cursor = "none";
                document.querySelector('.controls').style.opacity = "0";
            }, 3000);
        }

        // Start everything
        setInterval(updateClock, 1000);
        updateClock();

        // Sync time immediately, then resync every 10 minutes to correct any drift
        syncTime();
        setInterval(syncTime, 600000);

        (async function bootstrapSpotifyAuth() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            if (code) {
                const ok = await exchangeCodeForToken(code);
                const cleanUrl = window.location.origin + window.location.pathname;
                window.history.replaceState({}, '', cleanUrl);
                if (ok) {
                    spotifyStatusEl.innerText = "Spotify login successful. Load devices/playlists.";
                    await loadDevices();
                    await loadPlaylists();
                    await refreshPlayerState();
                } else {
                    spotifyStatusEl.innerText = "Spotify login failed.";
                }
            } else if (await refreshSpotifyTokenIfNeeded()) {
                spotifyStatusEl.innerText = "Spotify ready. Load devices to control your PC playback.";
                await loadDevices();
            }
        })();

    </script>
</body>
